<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Gửi dữ liệu</title>
        <style>
            body {
                font-family: "Segoe UI", Roboto, Arial, sans-serif;
                padding: 12px;
                width: 300px;
            }
            h3 {
                font-size: 16px;
                margin-bottom: 10px;
            }
            .preview {
                background: #f9f9f9;
                border: 1px solid #ddd;
                padding: 8px;
                margin-bottom: 12px;
                font-size: 13px;
                border-radius: 5px;
            }
            .preview p {
                margin: 4px 0;
                word-break: break-word;
            }
            button {
                background-color: #007bff;
                color: white;
                border: none;
                padding: 10px 16px;
                font-size: 14px;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #0056b3;
            }

            #loader {
                border: 4px solid #f3f3f3; /* Light grey */
                border-top: 4px solid #3498db; /* Blue */
                border-radius: 50%;
                width: 24px;
                height: 24px;
                animation: spin 1s linear infinite;
                display: none;
                margin: 10px auto;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <h3>Lấy Title & Link</h3>
        <div class="preview">
            <p>
                <strong>Title:</strong>
                <span id="titleText">Đang tải...</span>
            </p>
            <p>
                <strong>Link:</strong>
                <span id="linkText">Đang tải...</span>
            </p>
        </div>

        <button id="send">Tôi đồng ý</button>
        <div id="loader"></div>
        <script src="popup.js"></script>
    </body>
</html>
